<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Mobile preview</title>
<style>
  html, body {
    margin: 0;
    padding: 40px 0;
    background: #2b2b2b;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    min-height: 100vh;
  }
  .phone {
    width: 390px;
    height: 844px;
    border-radius: 44px;
    background: #000;
    padding: 14px;
    box-shadow: 0 20px 60px rgba(0,0,0,.6);
    box-sizing: border-box;
  }
  .phone iframe {
    width: 100%;
    height: 100%;
    border: none;
    border-radius: 30px;
    background: #fff;
    display: block;
  }
</style>
</head>
<body>
  <div class="phone">
    <iframe src="http://localhost:5000/" title="Mobile preview"></iframe>
  </div>
</body>
</html>
